name: ZC07 synthetic Zero-Copy E2E (no provider)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'bridge/zc07-mock-flow.mjs'
      - 'bridge/test/zc07-mock-flow.test.mjs'
      - 'docs/zc07-mock-e2e.md'
      - '.github/workflows/zc07-mock-e2e.yml'

permissions:
  contents: read

jobs:
  synthetic-e2e:
    if: >-
      github.repository == 'augusliang23-web/cc-h15a-claude-dispatch-lab' &&
      github.event.pull_request.head.repo.full_name == 'augusliang23-web/cc-h15a-claude-dispatch-lab' &&
      github.head_ref == 'zc/zc07-offline-mock-e2e' &&
      github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only checkout of exact proposed HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node.js (no package install)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check syntax and exact source SHA
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          node --check bridge/zc07-mock-flow.mjs
          node --check bridge/test/zc07-mock-flow.test.mjs
      - name: Synthetic in-memory E2E tests ONLY
        run: node --test --test-reporter=spec bridge/test/zc07-mock-flow.test.mjs
      - name: Emit sanitized mock outcome, never provider output
        run: node bridge/zc07-mock-flow.mjs --demo
