# H1.5A-4A — PREPARED_NOT_RUN. Creation is NOT permission to dispatch.
# Only workflow_dispatch. User approval required separately for H1.5A-4B.
# Fixed synthetic lab task only; not a general Issue-to-PR bridge.
name: H1.5A-4A Issue to PR bridge (manual canary only)

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Exact H1.5A-4B lab Issue number, strictly checked"
        required: true
        type: string

permissions: {}

concurrency:
  group: h15a-4a-single-canary
  cancel-in-progress: false

jobs:
  issue-to-pr-canary:
    name: Validate lab Issue and create one synthetic PR
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'augusliang23-web/cc-h15a-claude-dispatch-lab' && github.ref == 'refs/heads/main' && github.actor == 'augusliang23-web' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      issues: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: augusliang23-web/cc-h15a-claude-dispatch-lab
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      EXPECTED_ISSUE_TITLE: H15A4_DISPATCH_CANARY_V1
      EXPECTED_ISSUE_AUTHOR: augusliang23-web
      CONTRACT_MARKER: H15A4_DISPATCH_CONTRACT_V1
      CANARY_PHRASE: blue lantern
      BRANCH_NAME: lab/h15a4-bridge-canary-v1
      PR_TITLE: H15A4_CLAUDE_CANARY_V1
      FILE_PATH: tests/h15a4-issue-to-pr-canary-v1.txt
    steps:
      - name: Read-only strict guards
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]{0,3}$ ]] || { echo "HOLD: invalid Issue number"; exit 1; }
          issue_json="$(gh api "repos/$GH_REPO/issues/$ISSUE_NUMBER")"
          jq -e \
            --arg title "$EXPECTED_ISSUE_TITLE" \
            --arg author "$EXPECTED_ISSUE_AUTHOR" \
            --arg marker "$CONTRACT_MARKER" \
            --arg phrase "$CANARY_PHRASE" \
            '(.state == "open") and (.pull_request == null) and (.title == $title) and (.user.login == $author) and ((.body // "") | contains($marker)) and ((.body // "") | contains($phrase))' \
            <<< "$issue_json" > /dev/null || { echo "HOLD: Issue contract mismatch"; exit 1; }

          # Failure of either API read stops execution. One-shot, never overwrite.
          gh api "repos/$GH_REPO/git/matching-refs/heads/$BRANCH_NAME" \
            | jq -e 'length == 0' > /dev/null || { echo "HOLD: matching branch exists"; exit 1; }
          gh api "repos/$GH_REPO/pulls?state=all&head=augusliang23-web:$BRANCH_NAME&base=main&per_page=100" \
            | jq -e 'length == 0' > /dev/null || { echo "HOLD: matching PR exists"; exit 1; }
          base_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "HOLD: base SHA invalid"; exit 1; }
          printf 'base_sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"
          echo "PASS: trusted exact lab Issue; unused fixed branch"

      - name: Create fixed inert branch, one fixture and one PR
        shell: bash
        env:
          BASE_SHA: ${{ steps.guard.outputs.base_sha }}
        run: |
          set -euo pipefail
          # Do not execute or copy content from Issue body. No checkout.
          gh api -X POST "repos/$GH_REPO/git/refs" \
            -f ref="refs/heads/$BRANCH_NAME" -f sha="$BASE_SHA" > /dev/null

          fixture="H1.5A-4B synthetic canary.
          Test phrase: blue lantern
          Expected result: BLUE LANTERN
          No executable code or secrets.
          "
          encoded="$(printf '%s' "$fixture" | base64 -w 0)"
          jq -nc --arg content "$encoded" \
            --arg message "test(h1.5a-4b): add inert Issue-to-PR canary" \
            --arg branch "$BRANCH_NAME" \
            '{message: $message, content: $content, branch: $branch}' \
            | gh api -X PUT "repos/$GH_REPO/contents/$FILE_PATH" --input - > /dev/null

          body="H1.5A-4B synthetic Issue-to-PR canary.
          Source Issue: #$ISSUE_NUMBER
          Contract: H15A4_DISPATCH_CONTRACT_V1
          Test phrase: blue lantern
          Expected result: BLUE LANTERN
          Expected report marker: H15A4_CLAUDE_CANARY_REPORT
          No code edits, merge, deployment, or secrets.
          "
          gh api -X POST "repos/$GH_REPO/pulls" \
            -f title="$PR_TITLE" -f head="$BRANCH_NAME" -f base=main \
            -f body="$body" --jq '.html_url'
          echo "HOLD: external Claude GitHub App event handling not yet tested"
          # No retry, auto-merge, deletion, Issue comment or deploy.

# H1.5A-4B GO gates (NOT authorized by this workflow's creation):
# - Authorize exactly one run and expected Claude Pro usage.
# - Check repo Actions setting: allow Actions to create PR.
# - Update Claude Routine title filter to H15A4_CLAUDE_CANARY_V1.
# - Update Routine runtime author guard: PR will be github-actions[bot]
#   rather than augusliang23-web; constrain repository, title and branch.
# - Re-enable Routine only for the scheduled canary, then turn it off.
# - Verify GITHUB_TOKEN-created PR webhook delivery to Claude App.
# - If a partial branch remains after failure, STOP; no automatic cleanup.
