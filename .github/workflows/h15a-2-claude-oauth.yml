# H1.5A-2: PREPARED_NOT_RUN. User approval required for one actual dispatch.
# Single manual event. No recurring or auto-triggering events.
name: H1.5A-2 Claude OAuth isolated pilot

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: h15a-2-claude-oauth-single
  cancel-in-progress: false

jobs:
  claude-read-only:
    name: Validate Issue #2 and run synthetic Claude task
    if: github.repository == 'augusliang23-web/cc-h15a-claude-dispatch-lab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: read
    outputs:
      structured_output: ${{ steps.claude.outputs.structured_output }}
    steps:
      - name: Check synthetic Issue contract and prevent repeat calls
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'augusliang23-web/cc-h15a-claude-dispatch-lab'
          test "$GITHUB_REF" = 'refs/heads/main'
          issue="$(gh api "repos/$GITHUB_REPOSITORY/issues/2")"
          jq -e --arg title 'H1.5A-2 — Claude Pro OAuth One-Time Zero-Copy Pilot (PREPARE ONLY)' \
            '.number == 2 and .state == "open" and .title == $title and
            (.body | contains("H15A2_CLAUDE_CONTRACT_V1") and contains("Challenge phrase: `blue lantern`"))' \
            <<< "$issue" >/dev/null
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/2/comments?per_page=100" --jq '.[].body')"
          if grep -Fq 'H15A2_CLAUDE_REPORT_V1' <<< "$existing"; then
            echo 'STOP: prior result exists; no second provider call.'
            exit 1
          fi
          cat > "$RUNNER_TEMP/h15a2-prompt.txt" <<'EOF'
          This is a single synthetic AI handoff test.
          Task ID: H1.5A-2. The challenge phrase is: blue lantern.
          Return ONLY JSON fields task_id="H1.5A-2", uppercase_phrase="BLUE LANTERN".
          Do not access files, GitHub, network, or invoke tools.
          EOF

      - name: Claude Code via subscription OAuth (NO GitHub write)
        id: claude
        uses: anthropics/claude-code-action/base-action@f27be6b65a4652f08a2ba3cff79114829b588967
        with:
          prompt_file: ${{ runner.temp }}/h15a2-prompt.txt
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: 'false'
          claude_args: >-
            --model sonnet
            --effort low
            --max-turns 2
            --tools ""
            --disallowedTools "mcp__*"
            --json-schema '{"type":"object","properties":{"task_id":{"type":"string"},"uppercase_phrase":{"type":"string"}},"required":["task_id","uppercase_phrase"],"additionalProperties":false}'

  github-report:
    name: Deterministic Issue result (NO Claude OAuth)
    needs: claude-read-only
    if: needs.claude-read-only.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      CLAUDE_JSON: ${{ needs.claude-read-only.outputs.structured_output }}
    steps:
      - name: Validate exact result and post one report
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'augusliang23-web/cc-h15a-claude-dispatch-lab'
          test "$GITHUB_REF" = 'refs/heads/main'
          issue="$(gh api "repos/$GITHUB_REPOSITORY/issues/2")"
          jq -e --arg title 'H1.5A-2 — Claude Pro OAuth One-Time Zero-Copy Pilot (PREPARE ONLY)' \
            '.number == 2 and .state == "open" and .title == $title and (.body | contains("H15A2_CLAUDE_CONTRACT_V1"))' \
            <<< "$issue" >/dev/null
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/2/comments?per_page=100" --jq '.[].body')"
          if grep -Fq 'H15A2_CLAUDE_REPORT_V1' <<< "$existing"; then
            echo 'STOP: report already exists; no duplicate comment.'
            exit 1
          fi
          test -n "$CLAUDE_JSON"
          jq -e '.task_id == "H1.5A-2" and .uppercase_phrase == "BLUE LANTERN" and (keys | sort) == ["task_id","uppercase_phrase"]' \
            <<< "$CLAUDE_JSON" >/dev/null
          report="$(cat <<EOF
          # H15A2_CLAUDE_REPORT_V1
          Task: H1.5A-2
          Issue: https://github.com/augusliang23-web/cc-h15a-claude-dispatch-lab/issues/2
          Workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Provider: Claude Code official base-action with subscription OAuth
          Requested model / effort: sonnet / low
          Verified result: BLUE LANTERN
          GitHub permissions for Claude job: issues:read only
          Files / deployments: Not authorized
          Actual tokens / cost: UNKNOWN; verify separately
          READY_FOR_CONTROL_PLANE_REVIEW
          EOF
          )"
          id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/issues/2/comments" -f "body=$report" --jq '.id')"
          test -n "$id"
          readback="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$id" --jq '.body')"
          test "$readback" = "$report"
          echo "Report readback PASS; https://github.com/$GITHUB_REPOSITORY/issues/2#issuecomment-$id"
